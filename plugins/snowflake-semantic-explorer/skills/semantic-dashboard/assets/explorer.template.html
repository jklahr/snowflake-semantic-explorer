<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semantic dashboard</title>
<style>:root{--bg:#f6f6f3;--panel:#fff;--fg:#1f1f1c;--muted:#6c6c66;--line:#e4e4de;--soft:#f0f0eb;--accent:#3b6fb6;--accent-fg:#fff;--good:#1a7f4b;--bad:#b3261e;--warn:#9a6700;--c0:#3b6fb6;--c1:#d98324;--c2:#2a9d8f;--c3:#8e5ea2;--c4:#c0504d;--c5:#7a8b3c;--radius:10px;--shadow:0 6px 24px rgba(0,0,0,.14);--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a18;--panel:#242422;--fg:#ecebe6;--muted:#a3a29b;--line:#3a3a36;--soft:#2e2e2b;--accent:#6c9ee0;--accent-fg:#10151c;--good:#5ac98d;--bad:#ff8a80;--warn:#e3b341;--c0:#6c9ee0;--c1:#f0a64f;--c2:#52c2b3;--c3:#b88acb;--c4:#e57f7b;--c5:#a3b560;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1a18;--panel:#242422;--fg:#ecebe6;--muted:#a3a29b;--line:#3a3a36;--soft:#2e2e2b;--accent:#6c9ee0;--accent-fg:#10151c;--good:#5ac98d;--bad:#ff8a80;--warn:#e3b341;--c0:#6c9ee0;--c1:#f0a64f;--c2:#52c2b3;--c3:#b88acb;--c4:#e57f7b;--c5:#a3b560;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;font-variant-numeric:tabular-nums}
body{padding:14px}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:1280px;margin:0 auto;display:grid;gap:12px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title{font-size:1.35rem;font-weight:600;margin:0;border-radius:6px;padding:0 2px}
.title[contenteditable="true"]{outline:2px solid var(--accent);background:var(--panel)}
.subtitle{color:var(--muted);font-size:.8rem;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{border:none;background:transparent;border-radius:6px;width:26px;height:26px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover,.iconbtn:focus-visible{background:var(--soft);color:var(--fg)}
.iconbtn.ai{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;position:relative}
.filters .lab{color:var(--muted);font-size:.75rem;margin-right:2px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--soft);overflow:hidden}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.chip button{border:none;background:transparent;padding:4px 8px}
.chip .main{display:inline-flex;gap:6px;align-items:center;max-width:320px}
.chip .main b{font-weight:600}
.chip .main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .rm{padding:4px 6px;color:var(--muted)}
.chip .rm:hover{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 12px;min-width:0;position:relative;display:flex;flex-direction:column;min-height:120px}
.tile-h{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.tile-h h3{font-size:.85rem;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-h select{font:inherit;font-size:.75rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 4px;max-width:140px}
.tile-h .tools{display:flex;gap:0;opacity:.85}
.tile:hover .tools{opacity:1}
.kpi-val{font-size:1.9rem;font-weight:500;line-height:1.15;margin:2px 0}
.kpi-sub{display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.delta{display:inline-block;white-space:nowrap;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--soft)}
.delta .icon{display:inline-block;vertical-align:-3px;margin-right:2px;width:14px;height:14px}
.delta.good{color:var(--good)}.delta.bad{color:var(--bad)}.delta.flat{color:var(--muted)}
.spark{display:block;width:100%;height:36px;margin-top:6px}
.chartbox{position:relative;flex:1;min-height:200px}
.chartbox svg{display:block;width:100%}
.axis text{font-size:10px;fill:var(--muted)}
.axis line,.grid-l{stroke:var(--line)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px 8px;font-size:.75rem;z-index:20;white-space:nowrap;display:none}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.tablewrap{overflow:auto;max-height:340px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{position:sticky;top:0;background:var(--panel);text-align:right;color:var(--muted);font-weight:500;font-size:.72rem;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--soft)}
.skeleton{background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;height:100%;min-height:36px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
.err{color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center;flex:1;font-size:.8rem}
.err i{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block}
.pop{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;min-width:240px;max-width:min(380px,92vw);font-size:.8rem}
.pop h4{margin:0 0 6px;font-size:.8rem}
.pop .row{margin:6px 0}
.pop .k{color:var(--muted);font-size:.72rem}
.pop .def{margin:2px 0 0}
.pop .src{display:inline-block;background:var(--soft);border-radius:6px;padding:1px 6px;font-size:.72rem;word-break:break-all}
.pop .onto{border-left:3px solid var(--accent);padding-left:8px;margin-top:4px}
.pop .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.pop label.opt{display:flex;gap:6px;align-items:center;padding:3px 0}
.pop .list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin:6px 0}
.pop input[type=text],.pop select,.pop textarea,.modal input[type=text],.modal select,.modal textarea{font:inherit;width:100%;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.pop textarea,.modal textarea{min-height:92px;resize:vertical}
.pop .inline{display:flex;gap:6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:grid;place-items:center;padding:12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:92vh;overflow:auto;padding:14px 16px}
.modal h2{margin:0 0 10px;font-size:1rem}
.field{margin:10px 0}
.field>label{display:block;color:var(--muted);font-size:.72rem;margin-bottom:3px}
.metricpick{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin-top:4px}
.metricpick label{display:flex;gap:6px;align-items:center;padding:2px 0}
.metricpick small{color:var(--muted)}
.modal .btns{display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;right:14px;bottom:14px;background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:.8rem;z-index:80;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{grid-column:span 2!important}.tile.kpi{grid-column:span 1!important}}

.badge{display:inline-block;margin-left:8px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--muted);font-size:.72rem}
.tile-note{margin-top:6px;font-size:.72rem;color:var(--muted);line-height:1.4}
.foot{font-size:.74rem;color:var(--muted);line-height:1.5;padding:2px 2px 10px}

.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.72rem;color:var(--muted);margin:0 0 4px}
.legend i{display:inline-block;width:16px;vertical-align:middle;margin-right:5px;border-radius:2px}

.sqlbox{white-space:pre-wrap;word-break:break-all;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border-radius:6px;padding:6px 8px;max-height:110px;overflow:auto;margin:4px 0 0}

.pop[data-info]{max-height:min(70vh,520px);overflow:auto}
</style></head>

/* Semantic Explorer dashboard app (MCP App). */
const S = { spec: null, data: {}, errors: {}, tileMetric: {}, sort: {}, gen: 0, busy: false, pop: null, popAnchor: null, mounts: [], toastT: null, ctxT: null };
const POP_LABEL = { DoD: 'DoD', WoW: 'WoW', MoM: 'MoM', QoQ: 'QoQ', YoY: 'YoY', none: 'None' };

const timeDim = () => S.spec.time && S.spec.time.dimension;

  try {
    const r = await call('update_dashboard', { dashboard_id: S.spec.id, operations: ops, expected_version: S.spec.version });
    setSpec(r.spec);
  } catch (e) {
    toast('Could not save: ' + e.message);

    const cm = cmpMetric(tile);

      const total = !t || tile.value_mode === 'total';
      if (total) q['total:' + tile.id] = { metrics: [tile.metric, ...(cm ? [cm] : [])], dimensions: [], filters: S.spec.filters, limit: 1 };
      if (t && (!total || tile.sparkline || tile.pop !== 'none')) [tile.metric, ...(cm ? [cm] : [])].forEach(x => ser.add(x));

    } else {

/* ---------- derived KPI model ---------- */
function lagFor(pop, grain, ppy) {
  switch (pop) {
    case 'YoY': return ppy || 12;

    case 'QoQ': return grain === 'quarter' ? 1 : (grain === 'month' || grain === 'period') ? 3 : null;
    case 'WoW': return grain === 'week' ? 1 : grain === 'day' ? 7 : null;
    case 'DoD': return grain === 'day' ? 1 : null;
  }
  return null;
}

  const t = S.spec.time, lag = lagFor(pop, t.grain, t.periods_per_year);
  if (lag == null) return -1;
  if (pop === 'YoY') {
    const cand = String(periods[i]).replace(/\d{4}/, y => String(+y - 1)), j = periods.indexOf(cand);
    if (j >= 0) return j;
  }
  const j = i - lag; return j >= 0 ? j : -1;
}

  const t = S.spec.time, cm = cmpMetric(tile);
  const total = !t || tile.value_mode === 'total';
  const ser = S.data.series, tf = timeFilter();
  const spark = (periods, arr, end) => arr.slice(Math.max(0, end - 12), end + 1);
  if (total) {
    const d = S.data['total:' + tile.id]; if (!d) return null;
    const row = d.rows[0] || {}, v = row[tile.metric], out = { value: v, period: t ? 'Selected range' : '' };
    if (cm && row[cm]) out.cmp = { pct: (v - row[cm]) / Math.abs(row[cm]), label: cmpLabel(tile) };
    if (t && tile.sparkline && ser) {
      const rows = ser.rows.filter(r => !tf || filterMatches(tf, r[t.dimension]));
      out.spark = rows.map(r => r[tile.metric]);
    }
    return out;
  }
  if (!ser) return null;
  const periods = ser.rows.map(r => r[t.dimension]), arr = ser.rows.map(r => r[tile.metric]);
  let cur = -1; for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null && arr[i] !== 0) { cur = i; break; }
  if (cur < 0) return { value: null, period: '' };
  const out = { value: arr[cur], period: shortP(periods[cur]), periodRaw: periods[cur] };
  if (tile.pop && tile.pop !== 'none') {
    const j = priorIndex(periods, cur, tile.pop);
    if (j >= 0 && arr[j]) out.change = { pct: (arr[cur] - arr[j]) / Math.abs(arr[j]), label: POP_LABEL[tile.pop], prior: arr[j], priorPeriod: shortP(periods[j]) };
    else out.change = { pct: null, label: POP_LABEL[tile.pop] };

  if (cm) { const c = ser.rows[cur][cm]; if (c) out.cmp = { pct: (arr[cur] - c) / Math.abs(c), label: cmpLabel(tile) }; }

const goodDelta = (pct, m) => (pct >= 0) !== !!m.lower_is_better;

/* ---------- shell ---------- */
function renderShell() {

    onclick: () => { title.contentEditable = 'true'; title.focus(); },

    T.context(text, { dashboard_id: sp.id, version: sp.version, filters: sp.filters, tiles: sp.tiles.map(t => ({ id: t.id, type: t.type, title: t.title })) });

/* ---------- boot ---------- */
let lastGridWidth = 0, resizeT = null;
